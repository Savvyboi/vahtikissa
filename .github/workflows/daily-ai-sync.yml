name: Daily AI briefs and programme tags

on:
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum free-model requests (cached backfill resumes each run)
        default: '40'
        required: true
      refresh_programmes:
        description: Recheck original programme texts for changes
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/sync-ai-insights.mjs', 'ai-insights.js', 'scripts/ai-document-sources.mjs', '.github/workflows/daily-ai-sync.yml']

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Generate cached AI insights
        id: ai
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemma-4-31b-it:free' }}
          AI_MAX_REQUESTS: ${{ inputs.max_requests || vars.AI_MAX_REQUESTS || '40' }}
          REFRESH_PROGRAMMES: ${{ github.event_name == 'schedule' || inputs.refresh_programmes }}
        run: |
          if [ "$REFRESH_PROGRAMMES" = "true" ]; then
            npm run sync:ai -- --refresh-programmes
          else
            npm run sync:ai
          fi
      - name: Commit completed insights even after provider failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-insights.json
          if [ -d data/ai ]; then git add data/ai/; fi
          if [ -d data/ai-sources ]; then git add data/ai-sources/; fi
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh AI briefs and programme themes"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Report generation failure
        if: steps.ai.outcome == 'failure'
        run: |
          echo "AI generation stopped. Completed results were retained; rerun to resume. Check free-model availability and quota." >> "$GITHUB_STEP_SUMMARY"
          exit 1
