name: Daily AI briefs and programme tags

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum requests in this batch (1–150; all batches share 950 per UTC day)
        default: '150'
        required: true
      refresh_programmes:
        description: Recheck original programme texts for changes
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/sync-ai-insights.mjs', 'scripts/ai-document-sources.mjs', 'scripts/ai-request-budget.mjs']

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-backfill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Wait for older AI batches during scheduler transition
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const response=await fetch('https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/actions/workflows/daily-ai-sync.yml/runs?per_page=100',{
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}
          });
          if(!response.ok)throw Error('AI coordination check HTTP '+response.status);
          const runs=(await response.json()).workflow_runs;
          const older=runs.filter(run=>run.id<Number(process.env.GITHUB_RUN_ID)&&run.status!=='completed');
          await appendFile(process.env.GITHUB_OUTPUT,'ready='+(older.length===0)+'\n');
          if(older.length)console.log('An older AI batch is still active or queued; this slot will leave its quota untouched.');
          NODE
      - name: Reserve and persist daily free-model budget before inference
        id: budget
        if: steps.turn.outputs.ready == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MAX_REQUESTS: ${{ inputs.max_requests || vars.AI_MAX_REQUESTS || '150' }}
        run: |
          node scripts/ai-request-budget.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-request-budget.json
          git diff --cached --quiet && exit 0
          git commit -m "data: reserve daily AI request budget"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Generate cached AI insights
        id: ai
        if: steps.budget.outputs.requests != '' && steps.budget.outputs.requests != '0'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemma-4-31b-it:free' }}
          AI_MAX_REQUESTS: ${{ steps.budget.outputs.requests }}
          AI_BUDGET_RESERVATION: ${{ steps.budget.outputs.reservation }}
          AI_CONCURRENCY: '10'
          REFRESH_PROGRAMMES: ${{ inputs.refresh_programmes }}
        run: |
          if [ "$REFRESH_PROGRAMMES" = "true" ]; then
            npm run sync:ai -- --refresh-programmes
          else
            npm run sync:ai
          fi
      - name: Commit completed insights even after provider failures
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-insights.json data/ai-request-budget.json
          if [ -d data/ai ]; then git add data/ai/; fi
          if [ -d data/ai-sources ]; then git add data/ai-sources/; fi
          if git diff --cached --name-only | grep -qv '^data/ai-request-budget\.json$'; then
            echo "content_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh AI briefs and programme themes"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Publish changed briefs
        if: steps.commit.outputs.content_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/actions/workflows/pages.yml/dispatches',{
            method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({ref:'main'})
          });
          if(response.status!==204)throw Error('Pages dispatch HTTP '+response.status);
          console.log('Published-data deployment requested.');
          NODE
      - name: Report generation failure
        if: steps.ai.outcome == 'failure'
        run: |
          echo "AI generation stopped. Completed results and request accounting were retained. See the generation step for the exact error." >> "$GITHUB_STEP_SUMMARY"
          exit 1
