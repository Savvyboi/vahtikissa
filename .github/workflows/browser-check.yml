name: Browser and accessibility checks

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-audit-regressions.mjs
      - run: npm run test:performance
      - run: npm run test:release
      - run: npm run test:improvements
      - run: npm run test:browser
      - run: npm run test:charts
      - run: npm run test:loading-language
      - run: npm run test:ai-browser
      - run: npm run test:vote-reading
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-regression-screenshots
          path: .hermes-tmp.audit/
          if-no-files-found: ignore
