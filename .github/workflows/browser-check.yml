name: Browser and accessibility checks

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
    paths-ignore: ['data/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:performance
      - run: npm run test:release
      - run: npm run test:browser
      - run: npm run test:charts
      - run: npm run test:loading-language
      - run: npm run test:ai-browser
