name: Daily Eduskunta data sync

on:
  push:
    branches: [main]
    paths: ['scripts/http-retry.mjs', 'scripts/sync-data.mjs', 'scripts/lib.mjs', 'scripts/parliament-members.mjs', 'scripts/member-profiles.mjs', 'scripts/sync-member-contacts.mjs', 'scripts/sync-member-portraits.mjs', 'speech-research.js', 'speech-stopwords.js', 'app-utils.js', '.github/workflows/daily-sync.yml']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run sync
      - name: Refresh official directory contacts
        id: contacts
        continue-on-error: true
        run: npm run sync:contacts
      - name: Check for missing member portraits
        id: portraits
        run: |
          node --input-type=module -e "import {readFileSync,existsSync,appendFileSync} from 'node:fs'; const data=JSON.parse(readFileSync('data/parliament.json')); const missing=data.members.some(member=>!existsSync('assets/members/'+member.id+'.webp')); appendFileSync(process.env.GITHUB_OUTPUT,'missing='+missing+'\n');"
      - name: Prepare portrait importer
        id: portrait_browser
        if: steps.portraits.outputs.missing == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Download portraits for new members
        id: portrait_download
        if: steps.portrait_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: npm run sync:portraits
      - name: Validate generated data
        run: npm run validate-data
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/members/
          git diff --cached --quiet && exit 0
          git commit -m "data: daily Eduskunta sync"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Report directory contact refresh failure
        if: ${{ !cancelled() && steps.contacts.outcome == 'failure' }}
        run: |
          echo "The MP directory could not be refreshed. The previous contact snapshot was retained." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Report portrait refresh failure
        if: ${{ !cancelled() && (steps.portrait_browser.outcome == 'failure' || steps.portrait_download.outcome == 'failure') }}
        run: |
          echo "Some official portraits could not be refreshed. Available portraits and validated data can still be published." >> "$GITHUB_STEP_SUMMARY"
          exit 1
