name: Weekly budget, election and influence data sync

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: civic-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run sync:civic
      - name: Validate generated data
        run: npm run validate-data
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/budget.json data/elections-2023.json data/influence.json
          git diff --cached --quiet && exit 0
          git commit -m "data: weekly civic data sync"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
